{% extends 'base.html' %}
{% block title %}Log in — Boosting Score{% endblock %}
{% block content %}
<div class="bs-auth-page">
  <div class="bs-auth-card animate-fade">
    <div class="bs-auth-logo">Boosting<span>Score</span></div>
    <div class="bs-auth-title">Welcome back</div>
    <div class="bs-auth-sub">Log in to continue learning</div>
    {% if form.errors %}
    <div class="bs-auth-error">Incorrect email or password. Please try again.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <label class="bs-auth-label">Username</label>
      <input class="bs-auth-input" type="text" name="username" placeholder="your username" autocomplete="username" autofocus>
      <label class="bs-auth-label">Password</label>
      <input class="bs-auth-input" type="password" name="password" placeholder="••••••••••" autocomplete="current-password">
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="bs-auth-btn">Log in</button>
    </form>
    <div class="bs-auth-footer">No account? <a href="{% url 'signup' %}">Sign up free</a></div>
  </div>
</div>
{% endblock %}
