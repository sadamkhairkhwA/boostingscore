{% load static %}
<nav class="bs-nav">
  <a href="{% url 'home' %}" class="bs-nav-logo">Boosting<span>Score</span></a>
  <div class="bs-nav-links">
    <a href="{% url 'home' %}" class="bs-nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
    <a href="{% url 'vocabulary:home' %}" class="bs-nav-link {% if request.resolver_match.namespace == 'vocabulary' %}active{% endif %}">Vocabulary</a>
    <a href="{% url 'reading:home' %}" class="bs-nav-link {% if request.resolver_match.namespace == 'reading' %}active{% endif %}">Reading</a>
    <a href="{% url 'writing:home' %}" class="bs-nav-link {% if request.resolver_match.namespace == 'writing' %}active{% endif %}">Writing</a>
  </div>
  <div class="bs-nav-right">
    {% if user.is_authenticated %}
      <span class="bs-badge bs-badge-streak">🔥 {% if streak %}{{ streak }}{% else %}0{% endif %} day streak</span>
      <span class="bs-nav-user">{{ user.email|default:user.username|truncatechars:22 }}</span>
      <a href="{% url 'logout' %}" class="bs-nav-logout">Log out</a>
    {% else %}
      <a href="{% url 'login' %}" class="bs-nav-logout">Log in</a>
      <a href="{% url 'signup' %}" class="bs-btn-primary" style="font-size:12px;padding:7px 14px;">Sign up</a>
    {% endif %}
  </div>
</nav>
