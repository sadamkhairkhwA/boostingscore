<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Under maintenance — BoostingScore</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:#f6f7f4; color:#111827;
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:24px;
    }
    .mm-card{
      background:#fff; border:0.5px solid #E5E7EB; border-radius:12px;
      padding:40px 32px; max-width:420px; width:100%; text-align:center;
    }
    .mm-logo{ font-size:20px; font-weight:800; margin-bottom:28px; }
    .mm-logo span{ color:#3B6D11; }
    .mm-icon{
      width:44px; height:44px; margin:0 auto 20px; display:block; color:#3B6D11;
    }
    .mm-title{ font-size:18px; font-weight:700; margin-bottom:10px; }
    .mm-message{ font-size:14px; line-height:1.55; color:#374151; margin-bottom:18px; white-space:pre-line; }
    .mm-soon{ font-size:12.5px; color:#9CA3AF; }
  </style>
</head>
<body>
  <div class="mm-card">
    <div class="mm-logo">Boosting<span>Score</span></div>
    <svg class="mm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14.7 6.3a4.5 4.5 0 0 0-6 5.7L3 17.7A2.1 2.1 0 0 0 6 20.7l5.7-5.7a4.5 4.5 0 0 0 5.7-6l-3 3-2.8-.7-.7-2.8 3-3z"/>
    </svg>
    <h1 class="mm-title">Under maintenance</h1>
    <p class="mm-message">{{ message }}</p>
    <p class="mm-soon">Check back soon.</p>
  </div>
</body>
</html>
