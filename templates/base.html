{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Boosting Score{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/main.css' %}?v=13">
  <link rel="stylesheet" href="{% static 'css/bs-icons.css' %}">
  <link rel="stylesheet" href="{% static 'css/bs-cards.css' %}?v=1">
  <link rel="stylesheet" href="{% static 'css/avatar_menu.css' %}?v=1">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% include 'partials/nav.html' %}
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
  {% include 'partials/footer.html' %}
  <script src="{% static 'js/bs-icons.js' %}"></script>
  <script src="{% static 'js/avatar_menu.js' %}?v=1"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
