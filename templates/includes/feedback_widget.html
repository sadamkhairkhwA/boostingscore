{% load static %}
{% if user.is_authenticated %}
<link rel="stylesheet" href="{% static 'css/feedback.css' %}?v=2">
<div id="bs-feedback" class="bs-fb" data-submit-url="{% url 'feedback_submit' %}">
  <button type="button" class="bs-fb__fab" id="bs-fb-open" aria-label="Send feedback" aria-expanded="false" aria-controls="bs-fb-panel">
    <svg class="bs-fb__fab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
  </button>

  <div class="bs-fb__backdrop" id="bs-fb-backdrop" hidden></div>

  <div class="bs-fb__panel" id="bs-fb-panel" role="dialog" aria-modal="true" aria-labelledby="bs-fb-title" hidden>
    <div class="bs-fb__head">
      <h2 class="bs-fb__title" id="bs-fb-title">Send feedback</h2>
      <button type="button" class="bs-fb__close" id="bs-fb-close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </div>

    <form class="bs-fb__form" id="bs-fb-form" novalidate>
      {% csrf_token %}
      <fieldset class="bs-fb__types" id="bs-fb-types">
        <legend class="bs-fb__label">Type</legend>
        <div class="bs-fb__pills" role="radiogroup" aria-label="Feedback type">
          <button type="button" class="bs-fb__pill" data-type="bug" role="radio" aria-checked="false">Bug</button>
          <button type="button" class="bs-fb__pill is-active" data-type="suggestion" role="radio" aria-checked="true">Suggestion</button>
          <button type="button" class="bs-fb__pill" data-type="other" role="radio" aria-checked="false">Something else</button>
        </div>
      </fieldset>

      <label class="bs-fb__label" for="bs-fb-message">What's on your mind?</label>
      <textarea class="bs-fb__textarea" id="bs-fb-message" name="message" rows="4" maxlength="4000" required placeholder="Tell us what happened or what would help…"></textarea>

      <p class="bs-fb__error" id="bs-fb-error" hidden></p>

      <div class="bs-fb__actions">
        <button type="button" class="bs-fb__cancel" id="bs-fb-cancel">Cancel</button>
        <button type="submit" class="bs-fb__send" id="bs-fb-send">Send feedback</button>
      </div>
    </form>

    <div class="bs-fb__thanks" id="bs-fb-thanks" hidden>
      <p class="bs-fb__thanks-text">Thanks — got it!</p>
    </div>
  </div>
</div>
<script src="{% static 'js/feedback.js' %}?v=3" defer></script>
{% endif %}
