{% load static %}
<div class="bs-avatar-menu" data-avatar-menu>
  <button type="button" class="bs-avatar-menu__btn {{ avatar_class|default:'bs-avatar-menu__btn--nav' }}" aria-expanded="false" aria-haspopup="true" aria-label="Account menu" data-avatar-toggle>
    <span class="bs-avatar-menu__circle" aria-hidden="true">{{ avatar_initial }}</span>
  </button>
  <div class="bs-avatar-menu__panel" hidden data-avatar-panel>
    <a href="{% url 'profile_settings' %}" class="bs-avatar-menu__item">Profile</a>
    {# Django's LogoutView requires POST; a plain link caused 405 errors. #}
    <form method="post" action="{% url 'logout' %}" class="bs-avatar-menu__logout-form">
      {% csrf_token %}
      <button type="submit" class="bs-avatar-menu__item bs-avatar-menu__item--btn">Log out</button>
    </form>
  </div>
</div>
