<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Session expired — BoostingScore</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
      background:#f6f7f4; color:#111827; min-height:100vh;
      display:flex; align-items:center; justify-content:center; padding:24px;
    }
    .card{
      background:#fff; border:0.5px solid #E5E7EB; border-radius:12px;
      padding:36px 28px; max-width:420px; width:100%; text-align:center;
    }
    .logo{ font-size:20px; font-weight:800; margin-bottom:22px; }
    .logo span{ color:#3B6D11; }
    h1{ font-size:18px; font-weight:700; margin-bottom:10px; }
    p{ font-size:14px; line-height:1.55; color:#374151; margin-bottom:18px; }
    a.btn{
      display:inline-block; background:#3B6D11; color:#fff; text-decoration:none;
      font-size:14px; font-weight:600; padding:12px 22px; border-radius:10px;
    }
    a.btn:hover{ background:#2D5209; }
    .hint{ margin-top:16px; font-size:12px; color:#9CA3AF; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Boosting<span>Score</span></div>
    <h1>Your session expired</h1>
    <p>
      For security, this form needs a fresh page. This often happens after a
      site update — go back and try again.
    </p>
    <a class="btn" href="{{ next_url|default:'/admin/login/' }}">Reload form</a>
    <p class="hint">If it keeps happening, clear cookies for boostingscore.com and retry.</p>
  </div>
</body>
</html>
